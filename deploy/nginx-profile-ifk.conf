# Konfigurasi Virtual Host Nginx - Portal UPTD IFK Kotabaru
# Template ini dirender otomatis oleh setup-vps.sh

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN_NAME}};

    # Batas ukuran payload file upload (dokumen & gambar berita/produk)
    client_max_body_size 15M;

    # Kompresi Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Header Proteksi Keamanan Web
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache Aset Statis Terkompilasi Next.js (Immutable)
    location /_next/static/ {
        alias {{APP_DIR}}/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Berkas Upload Media & Dokumen Publik
    location /uploads/ {
        alias {{APP_DIR}}/public/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Favicon dan Berkas Statis Root
    location ~* \.(ico|png|jpg|jpeg|webp|svg|txt|xml)$ {
        root {{APP_DIR}}/public;
        expires 7d;
        access_log off;
        try_files $uri @proxy;
    }

    # Reverse Proxy ke Server Aplikasi Node.js / Next.js
    location / {
        try_files $uri @proxy;
    }

    location @proxy {
        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_http_version 1.1;

        # WebSocket & Persistent Connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Header Identifikasi Klien
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout proxy
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
