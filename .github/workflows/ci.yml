name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        if: hashFiles('playwright.config.ts') != ''
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        if: hashFiles('playwright.config.ts') != ''
        run: npx playwright test

      - name: Upload Playwright Report on Failure
        if: failure() && hashFiles('playwright.config.ts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failed-report
          path: playwright-report/
          retention-days: 7
